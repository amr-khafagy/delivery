name: Flutter Checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze demo code
        run: flutter analyze lib/main.dart test/widget_test.dart
      - name: Run widget tests
        run: flutter test
