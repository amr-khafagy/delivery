name: delivery
description: A self-contained Flutter portfolio demo for a delivery driver workflow.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-Regular (1).ttf
        - asset: assets/fonts/cairo/Cairo-Bold (1).ttf
          weight: 700
    - family: MaterialIcons
      fonts:
        - asset: assets/fonts/MaterialIcons-Regular.otf
